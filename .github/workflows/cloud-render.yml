name: G.I KO KO Cloud Render

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: "Export resolution"
        required: true
        type: choice
        default: 480p
        options:
          - 480p
          - 720p

permissions:
  contents: read

concurrency:
  group: lemo-opuscar-render
  cancel-in-progress: false

jobs:
  render:
    name: Render MP4 on GitHub-hosted runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout G.I KO KO project
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Lemo-Opuscar renderer
        run: |
          git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git "$RUNNER_TEMP/lemo-opuscar"
          cd "$RUNNER_TEMP/lemo-opuscar"
          npm install --no-audit --no-fund
          node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Render demo film
        env:
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          case "$RESOLUTION" in
            720p) SIZE="1280x720" ;;
            *) SIZE="854x480" ;;
          esac

          mkdir -p output
          cd "$RUNNER_TEMP/lemo-opuscar"
          node core/render/video.mjs "$GITHUB_WORKSPACE/films/demo" \
            --fps 24 \
            --workers 2 \
            --size "$SIZE" \
            --out "$GITHUB_WORKSPACE/output/GI-KO-KO-demo-${RESOLUTION}.mp4"

          test -s "$GITHUB_WORKSPACE/output/GI-KO-KO-demo-${RESOLUTION}.mp4"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-rendered-video
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
