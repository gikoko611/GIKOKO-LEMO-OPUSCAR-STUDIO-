name: G.I KO KO Cloud Render

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Film style"
        required: true
        type: choice
        default: cartoon2d
        options:
          - cartoon2d
          - cartoon3d
          - cinematic
      duration:
        description: "Video duration (minutes)"
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "5"
          - "10"
          - "30"
      resolution:
        description: "Export resolution"
        required: true
        type: choice
        default: 480p
        options:
          - 480p
          - 720p

permissions:
  contents: read

concurrency:
  group: lemo-opuscar-render
  cancel-in-progress: false

jobs:
  render:
    name: Render ${{ inputs.duration }} minute ${{ inputs.style }} film
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout G.I KO KO Studio
        uses: actions/checkout@v4

      - name: Install FFmpeg and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git python3-venv

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get Lemo-Opuscar renderer
        run: |
          git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git "$RUNNER_TEMP/lemo-opuscar"
          cd "$RUNNER_TEMP/lemo-opuscar"
          sh plugin/skills/lemo-opuscar/scripts/setup.sh deps

      - name: Render selected film
        env:
          STYLE: ${{ inputs.style }}
          DURATION: ${{ inputs.duration }}
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          case "$RESOLUTION" in
            720p) SIZE="1280x720" ;;
            *) SIZE="854x480" ;;
          esac

          mkdir -p output
          cd "$RUNNER_TEMP/lemo-opuscar"
          node core/render/video.mjs "$GITHUB_WORKSPACE/films/demo" \
            --fps 24 \
            --workers 2 \
            --size "$SIZE" \
            --q "style=$STYLE&duration=$((DURATION * 60))" \
            --out "$GITHUB_WORKSPACE/output/GI-KO-KO-$STYLE-${DURATION}min-$RESOLUTION.mp4"

          test -s "$GITHUB_WORKSPACE/output/GI-KO-KO-$STYLE-${DURATION}min-$RESOLUTION.mp4"

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-${{ inputs.style }}-${{ inputs.duration }}min-${{ inputs.resolution }}
          path: output/*.mp4
          if-no-files-found: error
          retention-days: 7
