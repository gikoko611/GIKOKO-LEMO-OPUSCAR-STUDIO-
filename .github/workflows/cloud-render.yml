name: G.I Ko Ko ViD Gen Cloud Render
run-name: G.I Ko Ko ViD Gen Render - ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      style:
        description: "Film style"
        required: true
        type: choice
        default: hybrid
        options: [hybrid, cartoon2d, cartoon3d, cinematic]
      duration:
        description: "Video duration (minutes)"
        required: true
        type: choice
        default: "1"
        options: ["1", "5", "10", "30"]
      resolution:
        description: "Export resolution"
        required: true
        type: choice
        default: 480p
        options: [480p, 720p]
      aspect_ratio:
        description: "Video aspect ratio"
        required: true
        type: choice
        default: "16:9"
        options: ["16:9", "9:16", "1:1", "4:5"]
      fps:
        description: "Video frame rate"
        required: true
        type: choice
        default: "24"
        options: ["24", "30", "60"]
      request_id:
        description: "Unique APK request identifier"
        required: true
        type: string
      project_json:
        description: "Story, scenes, dialogue, audio settings and optional compressed character reference image JSON"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: gikoko-vid-gen-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  render:
    name: Code-driven video render and audio export
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Studio project
        uses: actions/checkout@v4

      - name: Install FFmpeg, fonts and Python imaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts
          python - <<'PY'
          import PIL, edge_tts
          print("Cloud render dependencies OK: Pillow + edge-tts")
          PY

      - name: Validate project input
        env:
          PROJECT_JSON: ${{ inputs.project_json }}
        run: |
          set -euo pipefail
          mkdir -p output/segments
          printf '%s' "$PROJECT_JSON" > project.json
          python - <<'PY'
          import json, pathlib
          raw=pathlib.Path("project.json").read_text(encoding="utf-8")
          p=json.loads(raw)
          if not isinstance(p.get("scenes"), list) or not p["scenes"]:
              raise SystemExit("Project must contain at least one scene.")
          if len(raw) > 45000:
              raise SystemExit("Project JSON exceeds the APK input limit.")
          print("Project valid:", p.get("title","Untitled"), "| scenes:", len(p["scenes"]))
          code=p.get("animation_code","")
          if code and (not isinstance(code,str) or len(code)>24000): raise SystemExit("animation_code must be a string <= 24000 characters")
          ref=p.get("character_reference_base64","")
          if ref and len(ref)>30000: raise SystemExit("Character reference payload exceeds the 22 KB source-image limit.")
          PY

      - name: Analyze uploaded character reference with Gemini (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_VISION_MODEL: gemini-3.8-flash
        run: |
          set -euo pipefail
          python scripts/character_reference.py --project project.json --out project.json

      - name: Execute AI animation code in restricted JavaScript sandbox
        run: |
          set -euo pipefail
          node --version
          node scripts/animation_runtime.js project.json output/project.normalized.json
          python -c "import json; p=json.load(open(\"output/project.normalized.json\")); print(\"Sandbox scenes:\",len(p.get(\"animation_plan\",[]))); assert p.get(\"animation_plan\")"

      - name: Restore completed render segments
        uses: actions/cache@v4
        with:
          path: output/segments
          key: vid-gen-segments-${{ inputs.request_id }}-${{ runner.os }}-${{ github.run_attempt }}
          restore-keys: |
            vid-gen-segments-${{ inputs.request_id }}-${{ runner.os }}-

      - name: Render recoverable one-minute MP4 segments
        env:
          DURATION: ${{ inputs.duration }}
          RESOLUTION: ${{ inputs.resolution }}
          ASPECT_RATIO: ${{ inputs.aspect_ratio }}
          FPS: ${{ inputs.fps }}
        run: |
          set -euo pipefail
          TOTAL=$((DURATION * 60))
          INDEX=0
          for ((OFFSET=0; OFFSET<TOTAL; OFFSET+=60)); do
            REMAINING=$((TOTAL-OFFSET))
            SEGMENT_SECONDS=$((REMAINING<60 ? REMAINING : 60))
            SEGMENT=$(printf "output/segments/segment_%03d.mp4" "$INDEX")
            if [ -s "$SEGMENT" ]; then
              echo "RESUME: segment $INDEX already exists; skipping."
              INDEX=$((INDEX+1)); continue
            fi
            echo "RENDER_SEGMENT=$INDEX OFFSET=$OFFSET DURATION=$SEGMENT_SECONDS"
            SUCCESS=0
            for ATTEMPT in 1 2 3; do
              echo "Segment $INDEX attempt $ATTEMPT/3"
              if python scripts/render_video.py \
                --project output/project.normalized.json \
                --duration "$SEGMENT_SECONDS" \
                --offset "$OFFSET" \
                --resolution "$RESOLUTION" \
                --aspect-ratio "$ASPECT_RATIO" --fps "$FPS" \
                --out "$SEGMENT"; then
                SUCCESS=1; break
              fi
              rm -f "$SEGMENT"
              sleep $((ATTEMPT*5))
            done
            [ "$SUCCESS" -eq 1 ] || { echo "Segment $INDEX failed after 3 attempts"; exit 1; }
            INDEX=$((INDEX+1))
          done

      - name: Join rendered segments
        run: |
          set -euo pipefail
          : > output/segments.txt
          for f in output/segments/segment_*.mp4; do
            [ -s "$f" ] || continue
            printf "file '%s/%s'\n" "$GITHUB_WORKSPACE" "$f" >> output/segments.txt
          done
          test -s output/segments.txt
          ffmpeg -y -hide_banner -loglevel error -f concat -safe 0 \
            -i output/segments.txt -c copy -movflags +faststart output/video_silent.mp4
          test -s output/video_silent.mp4

      - name: Generate bilingual voice, music, SFX and Myanmar subtitles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: gemini-3.8-flash-tts
          TTS_PROVIDER: auto
        run: |
          python scripts/audio_pipeline.py \
            --project project.json \
            --out output/audio.wav \
            --duration "$(( ${{ inputs.duration }} * 60 ))" \
            --work output/audio_work

      - name: Mux MP4 with audio and subtitle track
        run: |
          set -euo pipefail
          if [ -f output/audio.srt ]; then
            ffmpeg -y -hide_banner -loglevel error \
              -i output/video_silent.mp4 -i output/audio.wav -i output/audio.srt \
              -map 0:v:0 -map 1:a:0 -map 2:s:0 \
              -c:v copy -c:a aac -b:a 160k -c:s mov_text \
              -metadata:s:s:0 language=mul -metadata:s:s:0 title="English + Myanmar" -movflags +faststart \
              "output/GI-KO-KO-VID-GEN-${{ inputs.style }}-${{ inputs.duration }}min-${{ inputs.resolution }}-${{ inputs.request_id }}.mp4"
          else
            ffmpeg -y -hide_banner -loglevel error \
              -i output/video_silent.mp4 -i output/audio.wav \
              -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k \
              -movflags +faststart \
              "output/GI-KO-KO-VID-GEN-${{ inputs.style }}-${{ inputs.duration }}min-${{ inputs.resolution }}-${{ inputs.request_id }}.mp4"
          fi
          test -s output/GI-KO-KO-VID-GEN-*.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 output/GI-KO-KO-VID-GEN-*.mp4


      - name: Publish direct MP4 download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MP4=$(find output -maxdepth 1 -type f -name 'GI-KO-KO-VID-GEN-*.mp4' -print -quit)
          test -n "$MP4"
          TAG="render-${GITHUB_RUN_ID}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "G.I Ko Ko ViD Gen Render ${GITHUB_RUN_ID}" --notes "Direct MP4 export from GitHub Actions run ${GITHUB_RUN_ID}." --latest=false
          fi
          gh release upload "$TAG" "$MP4" --clobber
          echo "DIRECT_MP4_RELEASE_TAG=$TAG"

      - name: Upload final MP4 and subtitle files
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-VID-GEN-${{ inputs.style }}-${{ inputs.duration }}min-${{ inputs.resolution }}-${{ inputs.request_id }}
          path: |
            output/GI-KO-KO-VID-GEN-*.mp4
            output/audio.srt
          if-no-files-found: error
          retention-days: 7
