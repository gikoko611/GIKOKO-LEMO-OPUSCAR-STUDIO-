name: Build G.I Ko Ko ViD Gen APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/cloud-render.yml"
      - ".github/workflows/story-assist.yml"
permissions:
  contents: write

concurrency:
  group: gikoko-vid-gen-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python and validate render engines
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f
          python -m pip install Pillow
      - name: Validate Python render pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_video.py scripts/audio_pipeline.py
          node --check scripts/animation_runtime.js
          cat > "$RUNNER_TEMP/sample-project.json" <<'JSON'
          {
            "title": "G.I Ko Ko ViD Gen Render Smoke Test",
            "character_bible": "A friendly golden royal guard.",
            "scenes": ["Palace courtyard", "A funny surprise"],
            "dialogue": [
              {"english": "I am ready!", "myanmar": "ကျွန်တော် အသင့်ဖြစ်ပါပြီ။"},
              {"english": "Let's begin!", "myanmar": "စတင်ကြစို့။"}
            ],
            "duration_minutes": "1",
            "bilingual_subtitles": true,
            "style": "cartoon2d",
            "animation_code": "function(api){ api.scene({title:'Sandbox Test', description:'AI-authored scene plan', duration:3, background:'#183344', motion:'bounce'}); }"
          }
          JSON
          node scripts/animation_runtime.js "$RUNNER_TEMP/sample-project.json" "$RUNNER_TEMP/normalized-project.json"
          python scripts/render_video.py \
            --project "$RUNNER_TEMP/normalized-project.json" \
            --duration 3 --offset 0 --resolution 480p \
            --out "$RUNNER_TEMP/gikoko-render-smoke.mp4"
          python scripts/audio_pipeline.py \
            --project "$RUNNER_TEMP/sample-project.json" \
            --out "$RUNNER_TEMP/gikoko-audio-smoke.wav" \
            --duration 3 --work "$RUNNER_TEMP/gikoko-audio-work"
          python - <<'PY'
          from pathlib import Path
          import os
          srt=Path(os.environ["RUNNER_TEMP"]) / "gikoko-audio-smoke.srt"
          text=srt.read_text(encoding="utf-8")
          assert "I am ready!" in text, "English subtitle missing"
          assert "ကျွန်တော် အသင့်ဖြစ်ပါပြီ။" in text, "Myanmar subtitle missing"
          print("Bilingual subtitle smoke test passed: English + Myanmar")
          PY
          ffmpeg -y -hide_banner -loglevel error \
            -i "$RUNNER_TEMP/gikoko-render-smoke.mp4" \
            -i "$RUNNER_TEMP/gikoko-audio-smoke.wav" \
            -i "$RUNNER_TEMP/gikoko-audio-smoke.srt" \
            -map 0:v:0 -map 1:a:0 -map 2:s:0 \
            -c:v copy -c:a aac -c:s mov_text \
            "$RUNNER_TEMP/gikoko-full-pipeline-smoke.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/gikoko-full-pipeline-smoke.mp4"
      - name: Upload end-to-end render smoke test
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-VID-GEN-RENDER-SMOKE-TEST
          path: ${{ runner.temp }}/gikoko-full-pipeline-smoke.mp4
          if-no-files-found: error
          retention-days: 3
      - name: Restore launcher icon uploaded from Termux
        run: |
          set -euo pipefail
          test -s assets/icons/icon-512.png
          mkdir -p app/src/main/res/drawable-nodpi
          cp assets/icons/icon-512.png app/src/main/res/drawable-nodpi/ic_launcher.png
          file app/src/main/res/drawable-nodpi/ic_launcher.png
          echo "Launcher icon restored from assets/icons/icon-512.png"
      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Clean build and assemble APK with fresh DEX inputs
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --rerun-tasks --stacktrace clean :app:assembleDebug
          CLASSES="app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes/com/gikoko/lemoopuscar"
          test -s "$CLASSES/MainActivity.class"
          test -s "$CLASSES/ProviderManager.class"
          echo "MainActivity.class: $(stat -c%s "$CLASSES/MainActivity.class") bytes"
          echo "ProviderManager.class: $(stat -c%s "$CLASSES/ProviderManager.class") bytes"
          echo "Compiled application classes verified after clean assemble."
      - name: Diagnose Java-to-DEX packaging inputs
        if: always()
        run: |
          set -euo pipefail
          echo "=== Compiled Java classes ==="
          find app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes -type f -name '*.class' -print 2>/dev/null | head -80 | while IFS= read -r f; do echo "$f $(stat -c%s "$f") bytes"; done || true
          echo "=== DEX intermediate files ==="
          find app/build/intermediates -type f -name '*.dex' -print 2>/dev/null | while IFS= read -r f; do echo "DEX: $f $(stat -c%s "$f") bytes"; done || true
          find app/build/intermediates -type f -name '*.jar' -print 2>/dev/null | grep -E 'dex|javac|project' | head -80 | while IFS= read -r f; do echo "JAR: $f $(stat -c%s "$f") bytes"; unzip -l "$f" | head -30; done || true
          echo "=== APK entries ==="
          unzip -l app/build/outputs/apk/debug/app-debug.apk 2>/dev/null | head -100 || true
          echo "=== Gradle dex task inputs ==="
          gradle --no-daemon :app:tasks --all | grep -E 'dexBuilderDebug|mergeProjectDexDebug|compileDebugJavaWithJavac' || true
      - name: Verify APK contains compiled application classes
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          CHECK="$RUNNER_TEMP/apk-check"
          test -s "$APK"
          mkdir -p "$CHECK"
          unzip -q "$APK" 'classes*.dex' 'AndroidManifest.xml' -d "$CHECK"
          test -s "$CHECK/AndroidManifest.xml"
          mapfile -t DEX_FILES < <(find "$CHECK" -maxdepth 1 -type f -name 'classes*.dex' | sort -V)
          test "${#DEX_FILES[@]}" -ge 1
          TOTAL_DEX=0
          for dex in "${DEX_FILES[@]}"; do
            size=$(stat -c%s "$dex")
            TOTAL_DEX=$((TOTAL_DEX + size))
            echo "$(basename "$dex"): $size bytes"
          done
          echo "APK size: $(stat -c%s "$APK") bytes"
          echo "Total DEX size: $TOTAL_DEX bytes"
          if [ "$TOTAL_DEX" -lt 4096 ]; then
            echo "ERROR: Combined DEX payload is suspiciously small."
            exit 1
          fi
          cat "${DEX_FILES[@]}" > "$CHECK/all-dex.bin"
          strings "$CHECK/all-dex.bin" > "$CHECK/dex-strings.txt"
          grep -F 'Lcom/gikoko/lemoopuscar/MainActivity;' "$CHECK/dex-strings.txt"
          grep -F 'Lcom/gikoko/lemoopuscar/ProviderManager;' "$CHECK/dex-strings.txt"
          unzip -l "$APK" | grep -E 'classes[0-9]*\.dex|AndroidManifest.xml'
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GI-KO-KO-VID-GEN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Update the single Latest APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          TAG="latest"
          TITLE="G.I KO KO ViD Gen — Latest"
          NOTES="Latest verified G.I KO KO ViD Gen APK. Updated automatically after each successful build. Build #${GITHUB_RUN_NUMBER}. Commit: ${GITHUB_SHA}."

          # Create the stable release if it does not exist yet.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing stable release: $TAG"
          else
            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          fi

          # Replace the APK asset in-place; keep the release URL and tag stable.
          gh release upload "$TAG" "$APK" --clobber
          gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease

          # Remove every other old release and its associated tag.
          gh release list --limit 1000 --json tagName --jq '.[].tagName' | while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            if [ "$old_tag" != "$TAG" ]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --yes
            fi
          done

          echo "Single stable release updated:"
          gh release view "$TAG" --json name,tagName,url,assets

      - name: Publish verifiable build status report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          cat > BUILD-STATUS.md <<EOF
          # G.I KO KO ViD Gen — Latest APK Build
          - Status: ${BUILD_STATUS}
          - Workflow: Build G.I Ko Ko ViD Gen APK
          - Run: #${GITHUB_RUN_NUMBER}
          - Run ID: ${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - APK artifact: GI-KO-KO-VID-GEN-APK
          - Run details: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest
          EOF
          CONTENT=$(base64 -w0 BUILD-STATUS.md)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/BUILD-STATUS.md" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/BUILD-STATUS.md" -f message="Record APK build verification #${GITHUB_RUN_NUMBER}" -f content="$CONTENT" -f branch="${GITHUB_REF_NAME}" -f sha="$SHA"
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/BUILD-STATUS.md" -f message="Record APK build verification #${GITHUB_RUN_NUMBER}" -f content="$CONTENT" -f branch="${GITHUB_REF_NAME}"
          fi
