name: Build G.I KO KO Studio APK
on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
      - ".github/workflows/cloud-render.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python and validate render engines
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fontconfig
          fc-cache -f
          python -m pip install Pillow
      - name: Validate Python render pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/render_video.py scripts/audio_pipeline.py
          cat > "$RUNNER_TEMP/sample-project.json" <<'JSON'
          {
            "title": "G.I KO KO Render Smoke Test",
            "character_bible": "A friendly golden royal guard.",
            "scenes": ["Palace courtyard", "A funny surprise"],
            "dialogue": [
              {"english": "I am ready!", "myanmar": "ကျွန်တော် အသင့်ဖြစ်ပါပြီ။"},
              {"english": "Let's begin!", "myanmar": "စတင်ကြစို့။"}
            ],
            "duration_minutes": "1",
            "style": "cartoon2d"
          }
          JSON
          python scripts/render_video.py \
            --project "$RUNNER_TEMP/sample-project.json" \
            --duration 3 --offset 0 --resolution 480p \
            --out "$RUNNER_TEMP/gikoko-render-smoke.mp4"
          python scripts/audio_pipeline.py \
            --project "$RUNNER_TEMP/sample-project.json" \
            --out "$RUNNER_TEMP/gikoko-audio-smoke.wav" \
            --duration 3 --work "$RUNNER_TEMP/gikoko-audio-work"
          ffmpeg -y -hide_banner -loglevel error \
            -i "$RUNNER_TEMP/gikoko-render-smoke.mp4" \
            -i "$RUNNER_TEMP/gikoko-audio-smoke.wav" \
            -i "$RUNNER_TEMP/gikoko-audio-smoke.srt" \
            -map 0:v:0 -map 1:a:0 -map 2:s:0 \
            -c:v copy -c:a aac -c:s mov_text \
            "$RUNNER_TEMP/gikoko-full-pipeline-smoke.mp4"
          ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1 "$RUNNER_TEMP/gikoko-full-pipeline-smoke.mp4"
      - name: Install Gradle 8.9
        run: |
          curl -L --fail --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GIKOKO-LEMO-OPUSCAR-STUDIO-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
